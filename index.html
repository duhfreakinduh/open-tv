<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Open TV">
  <title>Open TV — US Live</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <section class="watch" id="watch">
      <video id="video" playsinline preload="metadata"></video>
      <div class="shade">
        <div class="toprow">
          <div class="info">
            <b id="name">Open TV</b>
            <span id="details">US live TV</span>
          </div>
          <div class="utilities">
            <button id="favorite" class="utility" aria-label="Add channel to favorites" title="Favorite">♡</button>
            <button id="fullscreen" class="utility" aria-label="Enter fullscreen" title="Fullscreen">⛶</button>
          </div>
        </div>
        <div class="buttons">
          <button id="prev" aria-label="Previous channel">⏮</button>
          <button id="play" class="play" aria-label="Play or pause">▶</button>
          <button id="next" aria-label="Next channel">⏭</button>
        </div>
      </div>
    </section>
    <section class="guide">
      <header>
        <div><small>OPEN TV</small><h1>US Live TV</h1></div>
        <span id="status" aria-live="polite">Loading channels…</span>
      </header>
      <input id="search" type="search" placeholder="Search channels" autocomplete="off">
      <nav id="groups" aria-label="Categories"></nav>
      <div id="list"></div>
    </section>
  </main>
</body>
</html>
